name=IoTDBSinkConnector
connector.class=io.github.wendaoji.iotdb.IoTDBSinkConnector
tasks.max=1
topics=iotdb-meters
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter
iotdb.url=http://iotdb:18080
iotdb.user=${file:/run/secrets/iotdb.properties:user}
iotdb.password=${file:/run/secrets/iotdb.properties:password}
iotdb.database=power
iotdb.table=meters
iotdb.auto.create=true
iotdb.time.field=ts
iotdb.columns=device:STRING:TAG,site:STRING:ATTRIBUTE,current:DOUBLE:FIELD,voltage:INT32:FIELD
